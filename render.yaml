# Render Blueprint: one Node web service on the Free plan (spins down after 15 idle minutes, cold start
# about a minute) that serves both the API (/api) and the built web app, in front of a Neon Postgres
# database that is created separately (see docs/DEPLOYMENT.md).
#
# Rules this file encodes (checked by apps/api/test/unit/render-blueprint.test.ts):
# - VITE_API_URL is deliberately absent: with it unset, the production web build calls same-origin /api.
# - DATABASE_URL (Neon pooled) is a secret, typed into Render's dashboard when the Blueprint is first
#   created. It is never written here. DIRECT_DATABASE_URL is deliberately absent: Render never migrates.
# - The Free plan has no pre-deploy command, so there is none. Migrations and seeding are manual, run from a
#   trusted machine against Neon's direct URL (docs/OPERATIONS.md); the app never migrates or seeds.
# - The health check path is the database-free liveness route, so Render's frequent polling does not keep
#   a scale-to-zero database awake. The deep check is /api/health.
services:
  - type: web
    name: deadspace
    runtime: node
    plan: free
    region: ohio
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -w apps/api
    healthCheckPath: /api/livez
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      # Client IP for rate limits: the measured Render chain (loopback, Render internal, Cloudflare), trusted position
      # by position so any other shape fails closed. Deliberately not a TRUST_PROXY hop count; see docs/DEPLOYMENT.md.
      - key: TRUST_PROXY_PROFILE
        value: render-cloudflare
      - key: DEMO_LISTING_CREATION
        value: 'false'
      - key: WRITE_RATE_LIMIT_PER_HOUR
        value: '30'
      - key: MAX_ROWS_PER_TABLE
        value: '5000'
      - key: GEOCODER
        value: mock
      - key: DATABASE_URL
        sync: false
